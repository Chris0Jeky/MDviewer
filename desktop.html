<!doctype html>
<html lang="en" data-app-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MDviewer</title>
    <meta name="description" content="A local Markdown reader with editing and page-safe PDF export on demand." />
  </head>
  <body class="desktop-reader">
    <a class="reader-skip" href="#reader-document">Skip to document</a>
    <main id="reader-shell">
      <header class="shell-bar" aria-label="Document bar">
        <button id="shell-panel-toggle" class="shell-icon" type="button" aria-label="Library and outline" aria-expanded="false" aria-controls="shell-panel" aria-keyshortcuts="Control+B" title="Library and outline (Ctrl+B)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M6 2.5v11"/></svg></button>
        <div id="shell-tabs" class="shell-tabs" role="tablist" aria-label="Open documents" hidden></div>
        <span class="shell-spacer"></span>
        <button id="reader-edit-toggle" class="shell-edit" type="button" disabled aria-pressed="false" aria-keyshortcuts="Control+E" title="Edit the source beside the document (Ctrl+E)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2.5l2.5 2.5L6 12.5 3 13l.5-3z"/></svg>Edit</button>
        <button id="shell-more" class="shell-icon" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false" aria-controls="shell-more-menu" title="More"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="12.5" cy="8" r="1.2"/></svg></button>
        <div id="shell-more-menu" class="shell-menu" role="menu" aria-label="More" hidden></div>
      </header>
      <p id="reader-notice" class="reader-notice" role="status" aria-live="polite" hidden></p>
      <div class="reader-layout">
        <aside id="shell-panel" class="shell-panel" aria-label="Library and outline" hidden>
          <nav id="reader-outline" class="reader-outline" aria-label="Document headings"></nav>
        </aside>
        <div class="reader-split">
        <div id="reader-edit" class="reader-edit" hidden></div>
        <div id="reader-scroll" class="reader-scroll">
          <section id="reader-empty" class="reader-empty">
            <h1>Read and write Markdown.</h1>
            <p>Start a note, or open a file. You can also drop a .md file anywhere in this window.</p>
            <div class="reader-empty-actions">
              <button id="reader-new-empty" class="reader-primary" type="button" title="New document (Ctrl+N)" aria-keyshortcuts="Control+N">New document</button>
              <button id="reader-open-empty" type="button" title="Open Markdown (Ctrl+O)" aria-keyshortcuts="Control+O">Open…</button>
              <button id="reader-sample" class="reader-link" type="button">Try a sample</button>
            </div>
            <p class="reader-empty-hint"><kbd>Ctrl</kbd>+<kbd>K</kbd> commands and files · <kbd>Ctrl</kbd>+<kbd>P</kbd> print or export PDF</p>
            <small>Files stay on this computer. Nothing is uploaded.</small>
          </section>
          <article id="reader-document" class="doc reader-document" aria-label="Markdown document" tabindex="-1" hidden></article>
        </div>
        </div>
      </div>
      <footer class="reader-footer"><span id="reader-status" aria-live="polite">Local files · No uploads</span><span id="reader-save-state" class="reader-save-state"></span></footer>
    </main>
    <div id="desktop-workspace" hidden>
      <div class="reader-workspace-bar"><button id="reader-return" type="button">← Reading view</button><span>Save Markdown saves a copy.</span></div>
      <p id="workspace-notice" class="reader-notice" role="status" aria-live="polite" hidden></p>
      <div id="app"></div>
    </div>
    <input id="reader-file-input" type="file" accept=".md,.markdown,text/markdown,.json,.jsonc,.jsonl,.ndjson,.txt,.log,.yaml,.yml,.toml,.csv,.tsv" multiple hidden />
    <input id="file-input" type="file" accept=".md,.markdown,text/markdown,.json,.jsonc,.jsonl,.ndjson,.txt,.log,.yaml,.yml,.toml,.csv,.tsv" multiple hidden />
    <script type="module" src="/src/desktop/main.ts"></script>
  </body>
</html>
