name: Deploy (Pages direct upload)

# Manual promotion only. Build once, prove those bytes in Chromium, then pass
# the immutable artifact to either the credential-free dry job or production.
# AI-9 holds the first live automated deploy until the operator configures
# production reviewers, main-only branches and environment-scoped credentials.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify tested artifact only; no environment, credentials or Pages upload."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Never cancel an upload or let overlapping promotions race the stable URL.
concurrency:
  group: pages-direct-upload
  cancel-in-progress: false

jobs:
  e2e:
    name: Verify and test production artifact (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.tested_artifact.outputs.artifact-id }}
    steps:
      - name: Refuse non-main live refs
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        # Refs reach the shell through env, never expression interpolation.
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Live deploys run from main only (HEAD $GITHUB_SHA is on $REF). Use dry_run=true to verify another ref."
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Static verification (typecheck, lint, unit, serve, observatory)
        run: npm run agent:check

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Record artifact hashes and source identity before E2E
        run: node scripts/deployment-artifact.mjs create dist deployment-manifest.json "$GITHUB_SHA"
      - name: E2E tests (real Chromium, production bundle, incl. no-slice guarantee)
        run: npm run test:e2e
        env:
          E2E_TARGET: preview
      - name: Refuse mutations of the tested artifact
        run: node scripts/deployment-artifact.mjs verify dist deployment-manifest.json "$GITHUB_SHA"
      - name: Upload exact tested directory and manifest
        id: tested_artifact
        uses: actions/upload-artifact@v7
        with:
          name: tested-pages-artifact
          path: |
            dist/
            deployment-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-deploy
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  dry_run:
    name: Dry run (tested bytes, no production environment)
    if: ${{ inputs.dry_run }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.e2e.outputs.artifact-id }}
          path: deployment-artifact
          digest-mismatch: error
      - name: Verify downloaded files and SOURCE.txt against this run
        run: node scripts/deployment-artifact.mjs verify deployment-artifact/dist deployment-artifact/deployment-manifest.json "$GITHUB_SHA"
      - name: Dry-run verdict
        run: echo "Dry run passed for $GITHUB_SHA; verified the E2E-tested artifact without a production environment or Pages upload."

  deploy:
    name: Upload tested artifact to Pages
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This environment's branch policy and reviewers are the control: a
    # branch-local workflow can edit away shell guards. Keep AI-9 open until
    # the operator configures the environment; never use repository secrets.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.e2e.outputs.artifact-id }}
          path: deployment-artifact
          digest-mismatch: error
      - name: Verify downloaded files and SOURCE.txt before credentials
        run: node scripts/deployment-artifact.mjs verify deployment-artifact/dist deployment-artifact/deployment-manifest.json "$GITHUB_SHA"
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing production environment secret CLOUDFLARE_API_TOKEN. Setup: docs/DEPLOYMENT.md 'Automated deploy'."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing production environment secret CLOUDFLARE_ACCOUNT_ID. Setup: docs/DEPLOYMENT.md 'Automated deploy'."
            exit 1
          }
      - name: Upload tested dist/ to the mdviewer Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Upgrade the established Wrangler pin separately, with the runbook.
        run: npm exec --yes wrangler@4.114.0 -- pages deploy deployment-artifact/dist --project-name mdviewer --branch main
      - name: Confirm Cloudflare recorded this SHA as the newest main deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm exec --yes wrangler@4.114.0 -- pages deployment list --project-name mdviewer --json \
            | node -e "
              let text = '';
              process.stdin.on('data', (chunk) => (text += chunk)).on('end', () => {
                const newest = JSON.parse(text)[0];
                if (!newest || newest.Branch !== 'main' || newest.Source !== process.env.GITHUB_SHA.slice(0, 7)) {
                  console.error('Newest main deployment is not this SHA');
                  process.exit(1);
                }
                console.log('Live: ' + newest.Deployment + ' from ' + newest.Source);
              });
            "
